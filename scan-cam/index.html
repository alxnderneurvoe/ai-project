<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Scanner — IT Asset</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>SN Scanner</h1>
    <div class="status"><span class="dot" id="conn-dot"></span><span id="conn-text">Memeriksa koneksi…</span></div>
  </header>
  <p class="sub">Pilih tipe → pilih listing yang belum ada SN-nya → scan → submit.</p>

  <div class="card">
    <h2>1. Pilih Tipe</h2>
    <select id="type-select">
      <option value="">— pilih tipe —</option>
      <option>GTGH</option>
      <option>OLT C300</option>
      <option>OLT C320</option>
      <option>SFP</option>
      <option>ETP 48</option>
    </select>

    <h2>2. Pilih Listing (yang belum ada SN)</h2>
    <select id="listing-select" disabled>
      <option value="">— pilih listing —</option>
    </select>
    <div class="empty-note" id="listing-empty-note"></div>
  </div>

  <div class="card" id="scan-card" style="display:none;">
    <h2>3. Scan SN</h2>
    <div class="listing-code" id="active-listing"></div>
    <div id="reader"></div>
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="btn-primary" id="start-scan">Mulai Scan</button>
      <button class="btn-ghost" id="stop-scan" style="display:none;">Stop</button>
    </div>
    <label for="sn-input">Hasil Scan SN (bisa diedit manual)</label>
    <input type="text" id="sn-input" placeholder="Otomatis terisi setelah scan, atau ketik manual">
    <div class="btn-row">
      <button class="btn-primary" id="submit-btn">Submit</button>
      <button class="btn-ghost" id="cancel-btn">Batal</button>
    </div>
  </div>

  <div class="card">
    <h2>Status Listing Tipe Ini <span class="badge" id="count-badge">0</span></h2>
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="btn-ghost" id="refresh-btn">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Listing</th><th>Tipe</th><th>SN</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
